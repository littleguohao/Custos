# mypy 的 Linux 压噪配置（audit.sh 用；Windows 的 audit.ps1 不挂本文件，全量不压）。
#
# 只压「Linux 环境缺失」导致的 import 噪音，不动其他任何错误类别：
#   pandas    本机未装 pandas-stubs          → 36 条 import-untyped
#   mootdx.*  无 py.typed 标记               → 15 条 import-untyped
#   tqcenter  Windows 通达信插件，Linux 不存在 → 1 条 import-not-found
# Windows 生产机上这三类都可用，所以那边跑默认配置、不豁免。
[mypy]

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-mootdx.*]
ignore_missing_imports = True

[mypy-tqcenter.*]
ignore_missing_imports = True

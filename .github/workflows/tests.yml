# 双平台全绿门禁：本项目开发/运行在 Windows，但路径分隔符、控制台编码
# 这类平台差异已多次让「守卫测试在一侧空转或恒红」（2026-08-08 review），
# 所以两侧都必须真绿，不许只看一边。
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # uv.lock 在本机（国内清华源）生成，wheel URL 钉死 tuna 镜像；GitHub runner
      # 在海外访问 tuna 会 403。tuna 与 pythonhosted 的 /packages/ 路径逐位镜像、
      # 文件内容一致（lock 里 sha256 不变），CI 侧逐字换 host 即可，版本/哈希不动。
      - name: Rewrite tuna mirror URLs to PyPI (tuna 403s from GH runners)
        shell: bash
        run: sed -i 's|pypi\.tuna\.tsinghua\.edu\.cn/packages|files.pythonhosted.org/packages|g; s|pypi\.tuna\.tsinghua\.edu\.cn/simple|pypi.org/simple|g' uv.lock
      - run: uv run pytest -q
